name: E2E Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'PROJECT'
      - 'config/**'
      - '.github/workflows/test-e2e.yaml'

jobs:
  test-e2e:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Write allows the Docker GHA cache backend to save layer cache.
      actions: write

    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Install kind
        run: mise install kind

      - name: Verify kind installation
        run: kind version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # Prebuild the e2e image with GHA layer caching. BeforeSuite in
      # test/e2e/e2e_suite_test.go skips its own build when this tag exists,
      # so the image is built once per cache state instead of twice cold.
      - name: Build e2e image with cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: heartbeats-operator:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # BeforeSuite owns kind lifecycle (fresh cluster with
      # test/e2e/kind-config.yaml), so no separate create step here.
      - name: Running Test e2e
        run: |
          go mod download
          make test-e2e-ci
