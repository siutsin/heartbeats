name: E2E Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - Makefile
      - PROJECT
      - config/**
      - .mise.toml
      - "**/Dockerfile"
      - .github/workflows/**

jobs:
  test-e2e:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false

      - name: Install kind
        run: mise install kind

      - name: Verify kind installation
        run: kind version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Prebuild the e2e image. BeforeSuite in
      # test/e2e/e2e_suite_test.go skips its own build when this tag exists,
      # so the image is built once, not twice.
      - name: Build e2e image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: heartbeats-operator:test

      # BeforeSuite owns kind lifecycle (fresh cluster with
      # test/e2e/kind-config.yaml), so no separate create step here.
      - name: Running Test e2e
        run: |
          go mod download
          make test-e2e-ci
