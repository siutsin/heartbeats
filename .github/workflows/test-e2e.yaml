name: E2E Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'PROJECT'
      - 'config/**'
      - '.mise.toml'
      - '**/Dockerfile'
      - '.github/workflows/**'

jobs:
  test-e2e:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache: false

      - name: Install kind
        run: mise install kind

      - name: Verify kind installation
        run: kind version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Prebuild the e2e image. BeforeSuite in
      # test/e2e/e2e_suite_test.go skips its own build when this tag exists,
      # so the image is built once, not twice.
      - name: Build e2e image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: heartbeats-operator:test

      # BeforeSuite owns kind lifecycle (fresh cluster with
      # test/e2e/kind-config.yaml), so no separate create step here.
      - name: Running Test e2e
        run: |
          go mod download
          make test-e2e-ci
