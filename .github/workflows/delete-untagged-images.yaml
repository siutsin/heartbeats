name: Delete Untagged Images

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  clean-ghcr:
    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
      - name: ghcr.io cleanup action
        uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
        with:
          delete-untagged: true
          delete-ghost-images: true
          older-than: 3 months
          keep-n-tagged: 10
