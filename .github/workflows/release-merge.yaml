name: Merge Release PR

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

concurrency:
  group: release-merge

jobs:
  merge:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Merge pending release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --label "autorelease: pending" --state open --json number --jq '.[0].number')
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "No pending release PR."
            exit 0
          fi
          author=$(gh pr view "$pr" --json author --jq '.author.login')
          if [ "$author" != "github-actions[bot]" ]; then
            echo "Refusing to merge #$pr: unexpected author $author."
            exit 1
          fi
          files=$(gh pr diff "$pr" --name-only)
          if [ "$files" != "CHANGELOG.md" ]; then
            echo "Refusing to merge #$pr: unexpected files: $files."
            exit 1
          fi
          gh pr merge "$pr" --squash
