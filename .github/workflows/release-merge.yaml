name: Merge Release PR

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

concurrency:
  group: release-merge

jobs:
  merge:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Merge pending release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --label "autorelease: pending" --state open --json number --jq '.[0].number')
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "No pending release PR."
            exit 0
          fi
          author=$(gh pr view "$pr" --json author --jq '.author.login')
          if [ "$author" != "github-actions[bot]" ]; then
            echo "Refusing to merge #$pr: unexpected author $author."
            exit 1
          fi
          files=$(gh pr diff "$pr" --name-only)
          if ! echo "$files" | grep -qx "CHANGELOG.md"; then
            echo "Refusing to merge #$pr: no CHANGELOG.md."
            exit 1
          fi
          if echo "$files" | grep -qvFx -e "CHANGELOG.md" -e ".release-please-manifest.json"; then
            echo "Refusing to merge #$pr: unexpected files: $files."
            exit 1
          fi
          gh pr merge "$pr" --squash
